services:
  cassandra:
    image: "cassandra:${cassandra_image_version}"
    container_name: cassandra
    hostname: cassandra
    restart: unless-stopped
    user: "${UID}:${GID}"
    environment:
      CASSANDRA_CLUSTER_NAME: TheHive
      CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
      CASSANDRA_NUM_TOKENS: 4
      HEAP_NEWSIZE: 512M
      MAX_HEAP_SIZE: 2G
    volumes:
      - ./cassandra/data:/var/lib/cassandra
      - ./cassandra/logs:/var/log/cassandra
    deploy:
      resources:
        limits:
          memory: 3G
    memswap_limit: 3G
    networks:
      - thehive-cortex-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'describe keyspaces' || exit 1"]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: "docker.elastic.co/elasticsearch/elasticsearch:${elasticsearch_image_version}"
    container_name: elasticsearch
    hostname: elasticsearch
    restart: unless-stopped
    user: "${UID}:0"
    environment:
      http.host: 0.0.0.0
      discovery.type: single-node
      cluster.name: hive
      thread_pool.search.queue_size: 100000
      thread_pool.write.queue_size: 100000
      bootstrap.memory_lock: "true"
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: "${ELASTICSEARCH_PASSWORD}"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./elasticsearch/logs:/usr/share/elasticsearch/logs
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 3G
    memswap_limit: 3G
    networks:
      - thehive-cortex-network
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -u 'elastic:${ELASTICSEARCH_PASSWORD}' http://localhost:9200/_cat/health || exit 1"]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10

  thehive:
    image: "strangebee/thehive:${thehive_image_version}"
    container_name: thehive
    hostname: thehive
    restart: unless-stopped
    command: '--no-config --no-config-secret'
    user: "${UID}:${GID}"
    environment:
      JAVA_OPTS: "-Xms2g -Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m"
    volumes:
      - ./thehive/config:/etc/thehive:ro
      - ./thehive/data/files:/opt/thp/thehive/files
      - ./thehive/logs:/var/log/thehive
    deploy:
      resources:
        limits:
          memory: 3G
    memswap_limit: 3G
    networks:
      - thehive-cortex-network
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9000/thehive/api/status || exit 1"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      elasticsearch:
        condition: service_healthy
      cassandra:
        condition: service_healthy

  cortex:
    image: "thehiveproject/cortex:${cortex_image_version}"
    container_name: cortex
    hostname: cortex
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xms1g -Xmx1g -XX:MaxMetaspaceSize=400m -XX:ReservedCodeCacheSize=256m"
      es_uri: http://elasticsearch:9200
      job_directory: /tmp/cortex-jobs
      docker_job_directory: ${CORTEX_DOCKER_JOB_DIRECTORY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./cortex/cortex-jobs:/tmp/cortex-jobs
      - ./cortex/config:/etc/cortex:ro
      - ./cortex/logs:/var/log/cortex
      - ./cortex/neurons:/opt/cortexneurons
    deploy:
      resources:
        limits:
          memory: 2G
    memswap_limit: 2G
    networks:
      - thehive-cortex-network
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9001/cortex/api/status || exit 1"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      elasticsearch:
        condition: service_healthy

  nginx:
    image: "nginx:${nginx_image_version}"
    container_name: nginx
    hostname: nginx
    restart: unless-stopped
    environment:
      SERVER_NAME: "${NGINX_SERVER_NAME}"
      NGINX_SSL_TRUSTED_CERTIFICATE: "${NGINX_SSL_TRUSTED_CERTIFICATE}"
    volumes:
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/certs:/etc/nginx/certs
    ports:
      - "443:443"
    networks:
      - thehive-cortex-network
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - thehive
      - cortex

networks:
  thehive-cortex-network:
    driver: bridge
