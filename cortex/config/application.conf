# SECRET CONFIGURATION
include "/etc/cortex/secret.conf"

# INDEX DATABASE CONFIGURATION
include "/etc/cortex/index.conf"

play.http.context="/cortex"
play.http.parser.maxMemoryBuffer=1M
play.http.parser.maxDiskBuffer=1G
play.http.session.secure=false
play.filters.csrf.cookie.secure=false
play.filters.csrf.cookie.httpOnly=false
play.http.forwarded.trustedProxies=["0.0.0.0/0", "::/0"]
cache.job=10 minutes

auth {
  provider = [local]
  ad {}
  ldap {}
}

# =============================================================================
# Job runner — Docker execution mode
# =============================================================================
# Cortex spawns a NEW Docker container for each analyzer/responder job.
#
# The real config keys Cortex reads for this are `job.directory` (container-side
# path, where the Cortex process itself reads/writes job files) and
# `job.dockerDirectory` (host-absolute path used as the bind-mount SOURCE when
# spawning sibling analyzer containers via /var/run/docker.sock). Verified
# against the Cortex docker image's entrypoint script and
# DockerJobRunnerSrv.scala — `docker.baseDirectory` (previously set below) is
# NOT a real Cortex config key and was silently ignored.
#
# Both `job.directory` and `job.dockerDirectory` are already set correctly —
# the Cortex image's entrypoint generates them automatically from the
# `job_directory` / `docker_job_directory` environment variables on the
# `cortex` service in docker-compose.yml. Do not redeclare them here.
#
# job.directory and job.dockerDirectory are INTENTIONALLY different strings
# in this repo's setup:
#   job_directory=/tmp/cortex-jobs                      (Cortex's own container view)
#   docker_job_directory=${CORTEX_DOCKER_JOB_DIRECTORY}  (real host path, from .env)
# They only need to be identical if the cortex service itself were bind-mounted
# at the real host path instead of /tmp/cortex-jobs — it isn't, so both env
# vars must stay set as-is in docker-compose.yml.
#
# CRITICAL: Use python:3.11-slim (not 3.12+) for cortexutils compatibility.
#           Python 3.14 breaks json.load(sys.stdin) in cortexutils worker.py.
job {
  runner = ["docker"]
}

docker {
  # Pin the Python image used by analyzers/responders to 3.11.
  # cortexutils uses json.load(sys.stdin) which breaks on Python 3.14.
  # Do NOT change to python:3.12+ or python:latest.
  pythonImage = "python:3.11-slim"
}

analyzer {
  urls = [
    "https://download.thehive-project.org/analyzers.json"
    "/opt/cortexneurons/analyzers"
  ]

  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}

responder {
  urls = [
    "https://download.thehive-project.org/responders.json"
    "/opt/cortexneurons/responders"
  ]

  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}
