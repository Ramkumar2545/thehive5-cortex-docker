# SECRET CONFIGURATION
include "/etc/cortex/secret.conf"

# INDEX DATABASE CONFIGURATION
include "/etc/cortex/index.conf"

play.http.context="/cortex"
play.http.parser.maxMemoryBuffer=1M
play.http.parser.maxDiskBuffer=1G
play.http.session.secure=false
play.filters.csrf.cookie.secure=false
play.filters.csrf.cookie.httpOnly=false
play.http.forwarded.trustedProxies=["0.0.0.0/0", "::/0"]
cache.job=10 minutes

auth {
  provider = [local]
  ad {}
  ldap {}
}

# =============================================================================
# Job runner — Docker execution mode
# =============================================================================
# Cortex spawns a NEW Docker container for each analyzer/responder job.
# The job_directory inside Cortex (/tmp/cortex-jobs) is bind-mounted into
# the spawned worker container using docker_job_directory (host-absolute path).
#
# CRITICAL: docker.baseDirectory MUST match CORTEX_DOCKER_JOB_DIRECTORY in .env
#           AND the bind-mount source in docker-compose.yml.
#           Mismatch = empty stdin = JSONDecodeError in the worker.
#
# CRITICAL: Use python:3.11-slim (not 3.12+) for cortexutils compatibility.
#           Python 3.14 breaks json.load(sys.stdin) in cortexutils worker.py.
job {
  runner = ["docker"]
}

docker {
  # Host-absolute path shared with spawned worker containers.
  # Must match: docker_job_directory env var in docker-compose.yml
  #             CORTEX_DOCKER_JOB_DIRECTORY in .env
  baseDirectory = "/tmp/cortex-jobs"

  # Pin the Python image used by analyzers/responders to 3.11.
  # cortexutils uses json.load(sys.stdin) which breaks on Python 3.14.
  # Do NOT change to python:3.12+ or python:latest.
  pythonImage = "python:3.11-slim"
}

analyzer {
  urls = [
    "https://download.thehive-project.org/analyzers.json"
    "/opt/cortexneurons/analyzers"
  ]

  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}

responder {
  urls = [
    "https://download.thehive-project.org/responders.json"
    "/opt/cortexneurons/responders"
  ]

  fork-join-executor {
    parallelism-min = 2
    parallelism-factor = 2.0
    parallelism-max = 4
  }
}
